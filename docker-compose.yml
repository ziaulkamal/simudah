services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_simudah
    working_dir: /var/www

    volumes:
      - .:/var/www:cached
      - ./storage:/var/www/storage
      - ./vendor:/var/www/vendor

    networks:
      - private_net

    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  web:
    image: nginx:alpine
    container_name: web_simudah

    volumes:
      - .:/var/www:ro
      - ./vendor:/var/www/vendor:ro
      - ./storage:/var/www/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    command: ["nginx", "-g", "daemon off;"]

    depends_on:
      - app

    networks:
      - public_net
      - private_net

    # Jalankan Nginx sebagai root supaya bisa write cache & log
    user: root
    read_only: false

networks:
  public_net:
    external: true
  private_net:
    external: true
